<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#1A1A1A"/>
  <!-- Component grid layout (UI system icon) -->
  <!-- Top row: two blocks -->
  <rect x="14" y="16" width="30" height="18" rx="5" fill="white" opacity="0.9"/>
  <rect x="56" y="16" width="30" height="18" rx="5" fill="white" opacity="0.9"/>
  <!-- Middle: full-width block -->
  <rect x="14" y="42" width="72" height="18" rx="5" fill="white" opacity="0.6"/>
  <!-- Bottom row: three blocks -->
  <rect x="14" y="68" width="18" height="14" rx="4" fill="white" opacity="0.4"/>
  <rect x="41" y="68" width="18" height="14" rx="4" fill="white" opacity="0.4"/>
  <rect x="68" y="68" width="18" height="14" rx="4" fill="white" opacity="0.4"/>
</svg>
