<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#1B1F24"/>
  <!-- Document outline -->
  <rect x="18" y="12" width="50" height="64" rx="6" fill="none" stroke="#FCCA4A" stroke-width="4"/>
  <!-- Dog-ear fold -->
  <polyline points="52,12 68,28 52,28" fill="none" stroke="#FCCA4A" stroke-width="4" stroke-linejoin="round"/>
  <!-- MDX label -->
  <text x="18" y="96" font-family="monospace" font-weight="bold" font-size="22" fill="#FCCA4A" letter-spacing="1">.mdx</text>
  <!-- Code lines inside doc -->
  <line x1="26" y1="44" x2="58" y2="44" stroke="#FCCA4A" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="54" x2="48" y2="54" stroke="#FCCA4A" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
